# ワークフロー（CI）の名前
name: Backend CI

# いつ実行するか
on:
  # develop・作業ブランチへpushされた時
  # （developへのpushはPRマージ時、feature/fix/docs/hotfixへのpushはPR作成前の早期チェック用）
  push:
    branches:
      - develop
      - "feature/**"
      - "fix/**"
      - "docs/**"
      - "hotfix/**"

  # developブランチへのPull Request作成・更新時
  pull_request:
    branches:
      - develop

# 実行する処理
jobs:
  backend-ci:

    # GitHubが用意しているUbuntu環境で実行
    runs-on: ubuntu-latest

    steps:

      # リポジトリのソースコードを取得
      - name: Checkout source code
        uses: actions/checkout@v4

      # Pythonをインストール
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Poetryをインストール
      - name: Install Poetry
        run: |
          pip install poetry==2.3.3

      # Poetryが作成した仮想環境を利用
      - name: Install dependencies
        run: |
          poetry install

      # RuffでLintチェック
      - name: Run Ruff Lint
        run: |
          make lint

      # Ruff Formatterでフォーマットチェック
      - name: Run Ruff Format Check
        run: |
          make format-check

      # pytest実行
      - name: Run Tests
        run: |
          poetry run pytest
